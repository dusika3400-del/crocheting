<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Схема вязания | Вяжем вместе</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { padding-top: 70px; background: linear-gradient(135deg, #fdf8f0 0%, #f5ede0 100%); font-family: 'Roboto', sans-serif; }
        .navbar { background: linear-gradient(135deg, #5a3a22 0%, #3d2b1a 100%); border: none; }
        .navbar-brand { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #f5e6c8 !important; }
        .pattern-card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .pattern-image { border-radius: 15px; max-width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .difficulty { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .difficulty-easy { background: #d4edda; color: #155724; }
        .difficulty-medium { background: #fff3cd; color: #856404; }
        .difficulty-hard { background: #f8d7da; color: #721c24; }
        .pattern-text { background: #fdf8f0; padding: 20px; border-radius: 12px; font-family: monospace; white-space: pre-wrap; border: 1px solid #e8d5b8; line-height: 1.6; }
        .btn-back { background: #8b4513; color: white; border-radius: 50px; padding: 10px 25px; margin-bottom: 20px; display: inline-block; border: none; }
        .btn-back:hover { background: #6b3410; color: white; text-decoration: none; }
        h1, h3 { color: #8b4513; font-family: 'Playfair Display', serif; }
        .material-section { background: #f5ede0; padding: 15px; border-radius: 12px; margin: 20px 0; }
        .spinner { text-align: center; padding: 50px; font-size: 20px; color: #8b4513; }
    </style>
</head>
<body>

<nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="/">🧶 Вяжем вместе</a>
        </div>
    </div>
</nav>

<div class="container">
    <a href="/" class="btn-back">← На главную</a>
    
    <div id="patternContent" class="pattern-card">
        <div class="spinner">📖 Загрузка схемы...</div>
    </div>
</div>

<script>
    const patternId = window.location.pathname.split('/').pop();
    
    async function loadPattern() {
        try {
            const response = await fetch(`/api/patterns/${patternId}`);
            const p = await response.json();
            
            const difficultyClass = {
                'Начинающий': 'easy',
                'Средний': 'medium',
                'Сложный': 'hard'
            }[p.difficulty] || 'medium';
            
            document.getElementById('patternContent').innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <img src="${p.image_url}" class="pattern-image" alt="${p.title}">
                    </div>
                    <div class="col-md-6">
                        <h1>${p.title}</h1>
                        <p><strong>📂 Категория:</strong> ${p.category}</p>
                        <p><strong>⭐ Сложность:</strong> <span class="difficulty difficulty-${difficultyClass}">${p.difficulty}</span></p>
                        <div class="material-section">
                            <h3>🧶 Материалы</h3>
                            <p>${p.materials}</p>
                        </div>
                        <h3>📖 Описание</h3>
                        <p>${p.description}</p>
                    </div>
                </div>
                <div class="row" style="margin-top: 30px;">
                    <div class="col-md-12">
                        <h3>📝 Схема вязания</h3>
                        <div class="pattern-text">${p.pattern_text.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
                <div class="row" style="margin-top: 30px;">
                    <div class="col-md-12 text-center">
                        <hr style="border-color: #e8c47a;">
                        <p style="color: #8b4513;">💡 Сохраните эту страницу в закладки, чтобы не потерять схему!</p>
                        <button onclick="window.print()" class="btn btn-knitting" style="margin-top: 10px;">🖨️ Распечатать схему</button>
                    </div>
                </div>
            `;
        } catch (error) {
            document.getElementById('patternContent').innerHTML = `
                <div class="alert alert-danger">
                    <strong>❌ Ошибка!</strong> Схема не найдена. Возможно, она была удалена.
                </div>
            `;
        }
    }
    
    loadPattern();
</script>

</body>
</html>
